{% extends 'base.html' %}

{% block title %}修改学生 · 课程信息管理{% endblock %}

{% block page_title %}修改学生{% endblock %}
{% block page_sub %}正在编辑「{{ student.name }}」的资料{% endblock %}
{% block page_actions %}
    <a class="btn btn-ghost" href="{% url 'courses:list' %}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </svg>
        返回主页
    </a>
{% endblock %}

{% block content %}
    <section class="card">
        <form class="form-card" method="post"
              action="{% url 'courses:student_update' student.sno %}">
            {% csrf_token %}

            <div class="form-grid">
                <div class="field">
                    <label for="sno">学号（主键，不可修改）</label>
                    <input class="input" type="text" id="sno" value="{{ student.sno }}" readonly>
                    <p class="hint">学号是主键，如需变更请删除后重新添加。</p>
                </div>

                <div class="field">
                    <label for="name">姓名 <span class="req">*</span></label>
                    <input class="input" type="text" id="name" name="name" required
                           maxlength="30" value="{{ student.name }}">
                </div>

                <div class="field">
                    <label for="gender">性别</label>
                    <select class="input" id="gender" name="gender">
                        <option value="1" {% if student.gender == 1 %}selected{% endif %}>男</option>
                        <option value="0" {% if student.gender == 0 %}selected{% endif %}>女</option>
                    </select>
                </div>

                <div class="field">
                    <label for="age">年龄</label>
                    <input class="input" type="number" id="age" name="age"
                           min="1" max="150" value="{{ student.age }}">
                </div>

                <div class="field">
                    <label for="email">邮箱 <span class="opt">选填</span></label>
                    <input class="input" type="email" id="email" name="email" value="{{ student.email }}">
                </div>

                <div class="field">
                    <label for="phone">联系电话 <span class="opt">选填</span></label>
                    <input class="input" type="text" id="phone" name="phone"
                           maxlength="20" value="{{ student.phone }}">
                </div>

                <div class="field">
                    <label for="course">所报课程</label>
                    <select class="input" id="course" name="course">
                        <option value="">-- 暂不选课 --</option>
                        {% for c in courses %}
                            <option value="{{ c.title }}"
                                    {% if student.course_id == c.title %}selected{% endif %}>
                                {{ c.title }}（{{ c.get_type_display }}）
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label for="enroll_at">入学时间 <span class="req">*</span></label>
                    <input class="input" type="date" id="enroll_at" name="enroll_at" required
                           value="{{ student.enroll_at|date:'Y-m-d' }}">
                </div>

                <div class="field full">
                    <label for="introduction">个人简介 <span class="opt">选填</span></label>
                    <textarea class="input" id="introduction" name="introduction"
                              rows="3">{{ student.introduction }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">保存修改</button>
                <a class="btn btn-ghost btn-lg" href="{% url 'courses:list' %}">取消</a>
                <span class="spacer"></span>
            </div>
        </form>
    </section>
{% endblock %}
