{% extends 'base.html' %}

{% block title %}修改讲师 · 课程信息管理{% endblock %}

{% block page_title %}修改讲师{% endblock %}
{% block page_sub %}正在编辑「{{ teacher.nickname }}」的资料{% endblock %}
{% block page_actions %}
    <a class="btn btn-ghost" href="{% url 'courses:list' %}#teachers">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
        </svg>
        返回讲师信息
    </a>
{% endblock %}

{% block content %}
    <section class="card manage-form" aria-label="讲师信息表单">
        <form class="form-card" method="post"
              action="{% url 'courses:teacher_update' teacher.nickname %}">
            {% csrf_token %}

            <div class="form-grid">
                <div class="field full">
                    <label for="nickname">昵称</label>
                    <input class="input" type="text" id="nickname" name="nickname"
                           value="{{ teacher.nickname }}" readonly aria-describedby="nickname-hint">
                    <p class="hint" id="nickname-hint">昵称用于教师登录，添加后固定。</p>
                </div>

                <div class="field full">
                    <label for="introduction">简介</label>
                    <textarea class="input" id="introduction" name="introduction"
                              rows="4">{{ teacher.introduction }}</textarea>
                </div>

                <div class="field">
                    <label for="fans">粉丝数</label>
                    <input class="input" type="number" id="fans" name="fans"
                           min="0" value="{{ teacher.fans }}">
                </div>

                <div class="field">
                    <label for="updated_at">更新时间</label>
                    <input class="input" type="text" id="updated_at"
                           value="{{ teacher.update_at|date:'Y-m-d H:i:s' }}" readonly>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">保存修改</button>
                <a class="btn btn-ghost btn-lg" href="{% url 'courses:list' %}#teachers">取消</a>
            </div>
        </form>
    </section>
{% endblock %}
