{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加讲师</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/course.css' %}">
</head>
<body>
<div class="container">
    <h1>添加讲师</h1>

    <div class="panel">
        <form class="form-box" method="post" action="{% url 'courses:teacher_add' %}">
            {% csrf_token %}

            <div class="form-row">
                <label for="nickname">昵称 <span class="req">*</span></label>
                <input type="text" id="nickname" name="nickname" required
                       maxlength="30" placeholder="例如：老王">
            </div>

            <div class="form-row">
                <label for="introduction">简介</label>
                <textarea id="introduction" name="introduction" rows="4"
                          placeholder="这个老师很懒，木有签名的说~"></textarea>
            </div>

            <div class="form-row">
                <label for="fans">粉丝数</label>
                <input type="number" id="fans" name="fans" value="0" min="0" placeholder="0">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn btn-default" href="{% url 'courses:list' %}">返回主页</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
